name: "pruneStorage"
description: "Prune buildah storage cache to free disk space on Nomad nodes"

input_schema:
  type: "object"
  required: []
  properties:
    project:
      type: "string"
      description: "Optional: Only prune cache for a specific project/image name"
    all:
      type: "boolean"
      description: "Aggressive prune: remove all images and caches (requires force=true)"
    all_nodes:
      type: "boolean"
      description: "Prune on all Nomad nodes (uses sysbatch job type)"
    dry_run:
      type: "boolean"
      description: "Preview what would be cleaned without actually deleting"
    force:
      type: "boolean"
      description: "Skip safety checks and confirmation for aggressive prune"
