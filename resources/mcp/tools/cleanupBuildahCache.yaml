name: "cleanupBuildahCache"
description: "Clean up corrupted Buildah container database to fix 'identifier is not a container' errors"

input_schema:
  type: "object"
  required: []
  properties:
    node_name:
      type: "string"
      description: "Optional: Target a specific node by name (e.g., worker-1)"
    all_nodes:
      type: "boolean"
      description: "Clean up on all Nomad nodes (uses sysbatch job type)"
    full:
      type: "boolean"
      description: "Full reset: remove all storage directories (requires force=true)"
    dry_run:
      type: "boolean"
      description: "Preview what would be cleaned without actually executing"
    force:
      type: "boolean"
      description: "Skip safety checks (required for full reset)"
